# Aurora glass — true-black purple/teal terminal surface.
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

background #030308
foreground #e8eeff
selection_background #303859
selection_foreground #f7f9ff
cursor #54d7ff
cursor_text_color #030308
url_color #39e6c5

color0  #090912
color1  #ff6b8a
color2  #39e6c5
color3  #f0c674
color4  #54a7ff
color5  #9b6dff
color6  #54d7ff
color7  #c8d1ec
color8  #505873
color9  #ff88a4
color10 #68f2d6
color11 #ffe29a
color12 #83beff
color13 #b895ff
color14 #85e7ff
color15 #f7f9ff

background_opacity 0.88
dynamic_background_opacity yes
dim_opacity 0.82

window_padding_width 12
window_margin_width 0
single_window_margin_width -1
placement_strategy center
hide_window_decorations no
remember_window_size yes
initial_window_width  104c
initial_window_height 29c
confirm_os_window_close 0

scrollback_lines 10000
wheel_scroll_multiplier 4.0
touch_scroll_multiplier 1.0
mouse_hide_wait 2.0
copy_on_select no
strip_trailing_spaces smart
enable_audio_bell no
visual_bell_duration 0.0

cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.6
cursor_stop_blinking_after 15.0

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " {index}: {title} "
active_tab_foreground #030308
active_tab_background #54d7ff
active_tab_font_style bold
inactive_tab_foreground #8d96b3
inactive_tab_background #11111f
inactive_tab_font_style normal
tab_bar_background #080811

map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_selection
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

shell_integration enabled
allow_remote_control no
update_check_interval 0

# Matugen writes this atomically; later values override the curated fallback.
include /home/alex/.cache/aurora-theme/kitty.conf
